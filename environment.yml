# Environment for running test_pretrained_EN.ipynb.
# Targets the I-GUIDE Platform JupyterHub, but works for any JupyterHub or a local machine.
#
# Derived from the environment the notebook was actually executed in
# (python 3.10.21 / torch 2.1.0+cu121 / PyG 2.4.0 / lightning 2.0.9.post0, 1x H100).
# Verified: this package set is sufficient to import the notebook's full module chain.
#
#   conda env create -f environment.yml -p ~/envs/mswegnn
#   conda activate ~/envs/mswegnn
#   python -m ipykernel install --user --name mswegnn --display-name "Python (mswegnn)"
#
# The kernel MUST be named `mswegnn`: that is the kernelspec recorded in the notebook.
#
# GPU vs CPU: replace the torch line with the CPU wheel if the platform gives you no GPU
#   --extra-index-url https://download.pytorch.org/whl/cpu
# The CUDA build is ~2.5 GB installed, the CPU build ~200 MB. Check your home quota first.
name: mswegnn
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # --- load-bearing pins -------------------------------------------------
      # lightning 2.1+ raises TypeError: the upstream code calls
      # plmodule.load_from_checkpoint(...) on an INSTANCE, which 2.0.9.post0 allows.
      - lightning==2.0.9.post0
      - torch==2.1.0
      - torch_geometric==2.4.0        # no torch_scatter/torch_sparse needed for this model
      # --- used by the notebook ---------------------------------------------
      - numpy==1.26.4
      - scipy==1.11.3
      - pandas==2.1.1
      - matplotlib==3.8.0
      - scikit-learn==1.3.2
      - wandb==0.15.12                # notebook runs it with mode="disabled"
      - ipykernel
      # --- import-time only --------------------------------------------------
      # database/graph_creation.py imports these at module level. The notebook only
      # uses plot_faces / plot_multiscale_mesh_properties from it, but the import
      # still has to succeed.
      - meshkernel==3.0.0
      - triangle
      - shapely==2.0.2
      - networkx
      - netCDF4==1.6.4
      - xarray==2023.10.1
